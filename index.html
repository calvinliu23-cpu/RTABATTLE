<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>單淘汰賽對戰系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b0e16;
    --panel:#121726;
    --panel-raised:#182036;
    --line: rgba(255,255,255,0.10);
    --line-strong: rgba(255,255,255,0.18);
    --text:#eef0f6;
    --muted:#8993ab;
    --brass:#e3b04f;
    --brass-dim: rgba(227,176,79,0.18);
    --teal:#3fb8ac;
    --teal-dim: rgba(63,184,172,0.16);
    --danger:#e2596b;
    --danger-dim: rgba(226,89,107,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
    font-variant-numeric: tabular-nums;
    min-height:100vh;
  }
  h1,h2,h3,.disp{
    font-family:'Oswald',system-ui,sans-serif;
    letter-spacing:.02em;
    font-weight:600;
    margin:0;
  }
  a{color:var(--teal);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::selection{background:var(--brass-dim);}

  #app{max-width:1400px;margin:0 auto;padding:20px 20px 80px;}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:16px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);
    padding-bottom:14px;margin-bottom:18px;
  }
  .topbar h1{font-size:26px;}
  .topbar .sub{color:var(--muted);font-size:13px;margin-top:4px;}

  /* ---------- key visual ---------- */
  .keyvisual-wrap{margin-bottom:18px;}
  .keyvisual{
    width:100%;max-height:320px;object-fit:cover;
    border-radius:4px;border:1px solid var(--line);display:block;
  }

  /* ---------- division tabs ---------- */
  .div-tabs{
    display:flex;
    gap:8px;
    margin-bottom:20px;
    flex-wrap:nowrap;
    width:100%;
  }
  .div-tab{
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--muted);
    padding:9px 12px;
    border-radius:3px;
    font-size:14px;
    font-weight:600;
    font-family:'Oswald',sans-serif;
    letter-spacing:.02em;
    flex:1 1 0;
    min-width:0;
    text-align:center;
  }
  .div-tab .meta{
    display:block;
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:11px;
    margin-top:2px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .div-tab.active{border-color:var(--teal);color:var(--teal);background:var(--teal-dim);}
  .div-tab.active .meta{color:var(--teal);}
  .div-tab .crown{color:var(--brass);margin-left:4px;}

  /* ---------- hero / status ---------- */
  .hero{margin-bottom:22px;}
  .hero .status-line{font-size:15px;color:var(--muted);}
  .hero .champion{
    font-family:'Oswald',sans-serif;
    font-size:clamp(26px,4.5vw,46px);
    font-weight:700;color:var(--brass);
    line-height:1.1;margin-top:6px;
  }
  .hero .champion .lead{
    display:block;font-family:'Inter',sans-serif;font-weight:500;
    font-size:13px;color:var(--muted);letter-spacing:.03em;margin-bottom:6px;
  }

  /* ---------- empty state ---------- */
  .empty{
    border:1px dashed var(--line-strong);
    padding:40px 24px;text-align:center;color:var(--muted);
    border-radius:4px;
  }
  .empty p{margin:6px 0;}
  .empty code{background:var(--panel-raised);padding:2px 6px;border-radius:3px;color:var(--teal);}

  /* ---------- searchbar with magnifying glass ---------- */
  .searchbar{margin-bottom:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .search-input-wrap{
    position:relative;
    display:inline-flex;
    align-items:center;
  }
  .search-input-wrap input{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    padding:9px 36px 9px 12px;
    border-radius:3px;
    font-size:14px;
    min-width:240px;
  }
  .search-input-wrap input:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
  .search-btn{
    position:absolute;
    right:6px;
    background:none;
    border:none;
    color:var(--muted);
    font-size:15px;
    padding:4px 6px;
    border-radius:3px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .search-btn:hover{color:var(--teal);}
  .searchbar .count{color:var(--muted);font-size:13px;}

  /* ---------- bracket (tree diagram) ---------- */
  .bracket-scroll{
    max-height:72vh;overflow:auto;
    border:1px solid var(--line);border-radius:4px;
    background:var(--panel);
    scroll-behavior:smooth;
  }
  .bracket-header{
    position:sticky;top:0;z-index:3;
    display:flex;background:var(--panel-raised);
    border-bottom:1px solid var(--line);
  }
  .bracket-header .rh-cell{
    flex:0 0 auto;padding:10px 4px;
    font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.03em;
  }
  .bracket-header .rh-cell .fmt{
    display:block;font-family:'Inter',sans-serif;font-size:11px;
    font-weight:500;color:var(--muted);margin-top:2px;
  }
  .bracket-canvas{position:relative;}
  .bconn{position:absolute;background:var(--line-strong);pointer-events:none;}

  .match{
    position:absolute;
    background:var(--panel-raised);
    border:1px solid var(--line);
    border-radius:3px;
    overflow:visible;
    transition:border-color 0.3s, box-shadow 0.3s;
  }
  .match.hl{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal);z-index:2;}
  
  /* 左上角對戰標籤 */
  .match-tag{
    position:absolute;
    top:-9px;
    left:4px;
    background:#080c14;
    border:1px solid var(--line-strong);
    color:var(--teal);
    font-size:9px;
    font-weight:600;
    padding:0px 5px;
    border-radius:2px;
    line-height:14px;
    z-index:1;
    pointer-events:none;
    letter-spacing:0.02em;
    white-space:nowrap;
  }

  .prow{
    display:flex;align-items:center;justify-content:space-between;
    height:30px;box-sizing:border-box;
    padding:0 9px;font-size:13px;gap:6px;
    border-bottom:1px solid var(--line);
  }
  .prow:last-child{border-bottom:none;}
  .prow .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .prow .score{font-weight:600;color:var(--muted);}
  .prow.bye .name, .prow.pending .name{color:var(--muted);font-style:italic;}
  .prow.winner{background:var(--brass-dim);}
  .prow.winner .name{color:var(--brass);font-weight:600;}
  .prow.winner .score{color:var(--brass);}

  /* ---------- admin ---------- */
  .gate{max-width:340px;margin:60px auto;text-align:center;}
  .gate .disp{font-size:20px;margin-bottom:14px;}
  .gate input{
    width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:10px 12px;border-radius:3px;font-size:14px;margin-bottom:10px;
  }
  .gate button{
    width:100%;background:var(--teal);color:#04211d;border:none;
    padding:10px 12px;border-radius:3px;font-weight:600;font-size:14px;
  }
  .gate .err{color:var(--danger);font-size:13px;min-height:18px;margin-top:6px;}

  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:4px;
    padding:16px 18px;margin-bottom:18px;
  }
  .panel h2{font-size:16px;margin-bottom:10px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;}
  .field textarea{
    width:100%;min-height:140px;background:var(--ink);border:1px solid var(--line);
    color:var(--text);border-radius:3px;padding:10px;font-size:13px;resize:vertical;
    line-height:1.5;
  }
  .field select{
    background:var(--ink);border:1px solid var(--line);color:var(--text);
    padding:7px 10px;border-radius:3px;font-size:13px;
  }
  .row-inline{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .checkbox-line{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);}
  .btn{
    border:1px solid var(--line-strong);background:var(--panel-raised);color:var(--text);
    padding:8px 14px;border-radius:3px;font-size:13px;font-weight:500;
  }
  .btn:hover{border-color:var(--teal);color:var(--teal);}
  .btn.primary{background:var(--teal);color:#04211d;border-color:var(--teal);font-weight:600;}
  .btn.primary:hover{filter:brightness(1.08);color:#04211d;}
  .btn.danger{background:var(--danger-dim);border-color:var(--danger);color:var(--danger);}
  .btn.danger:hover{background:var(--danger);color:#2a0508;}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn:disabled:hover{border-color:var(--line-strong);color:var(--text);}
  .small{font-size:12px;padding:5px 9px;}

  details.round-block{
    border:1px solid var(--line);border-radius:4px;margin-bottom:10px;overflow:hidden;
  }
  details.round-block summary{
    list-style:none;cursor:pointer;padding:12px 14px;
    background:var(--panel-raised);
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  details.round-block summary::-webkit-details-marker{display:none;}
  details.round-block summary .rname{font-family:'Oswald',sans-serif;font-size:15px;}
  details.round-block summary .progress{font-size:12px;color:var(--muted);}
  details.round-block summary .progress.done{color:var(--brass);}
  .round-body{padding:6px 10px;}

  .m-row{
    display:flex;align-items:center;gap:10px;
    padding:9px 4px;border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .m-row:last-child{border-bottom:none;}
  .m-row .idx{color:var(--muted);font-size:11px;width:26px;flex:0 0 26px;}
  .m-side{display:flex;align-items:center;gap:6px;min-width:150px;flex:1 1 150px;}
  .m-side .pname{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px;}
  .m-side.win .pname{color:var(--brass);font-weight:600;}
  .m-side.bye .pname, .m-side.empty .pname{color:var(--muted);font-style:italic;}
  .scorebtn{
    width:26px;height:26px;border-radius:3px;border:1px solid var(--line-strong);
    background:var(--ink);color:var(--teal);font-size:14px;line-height:1;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex:0 0 26px;
  }
  .scorebtn:hover:not(:disabled){background:var(--teal-dim);}
  .scoreval{font-weight:700;font-size:14px;width:16px;text-align:center;}
  .vs{color:var(--muted);font-size:11px;padding:0 2px;}
  .status-badge{font-size:11px;color:var(--muted);flex:0 0 auto;min-width:56px;}
  .status-badge.done{color:var(--brass);}
  .m-actions{flex:0 0 auto;margin-left:auto;display:flex;gap:6px;}

  .footer-note{color:var(--muted);font-size:12px;margin-top:24px;line-height:1.7;border-top:1px solid var(--line);padding-top:14px;}

  @media (max-width:640px){
    #app{padding:12px 8px 60px;}
    .div-tab{padding:7px 4px; font-size:13px;}
    .div-tab .meta{font-size:10px;}
    .m-side .pname{max-width:90px;}
  }
</style>
</head>

<div id="app">載入中…</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ---------- Firebase 初始化 ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyD-y_QJH9CyOoVuZmHAwQrCO61XC4QnFKA",
  authDomain: "tournament-app-74296.firebaseapp.com",
  databaseURL: "https://tournament-app-74296-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tournament-app-74296",
  storageBucket: "tournament-app-74296.firebasestorage.app",
  messagingSenderId: "360385062829",
  appId: "1:360385062829:web:51a2db228de5d78f87e324"
};
firebase.initializeApp(firebaseConfig);
const dbRef = firebase.database().ref('tournamentState');

/* ============================================================
   三組別（菁英區／大師區／巔峰區）單淘汰賽 — 資料模型與邏輯
   ============================================================ */
const DIVISIONS = [
  {id:'elite',  name:'菁英區'},
  {id:'master', name:'大師區'},
  {id:'apex',   name:'巔峰區'}
];
const SIZE_OPTIONS = [128,64,32,16];
const CARD_W = 176;
const CARD_H = 62;
const COL_GAP = 48;
const ROW_GAP = 14;
const UNIT = CARD_H + ROW_GAP;
const TOP_PAD = 16;
const BYE = 'BYE';
const ADMIN_PASSWORD = 'admin123';
const CN_NUM = ['一','二','三','四','五','六','七','八'];

let allState = null;
let currentDiv = 'elite';
let pollTimer = null;
let currentQuery = '';
let openRoundBlocks = {}; // 記憶後台開啟的輪次選單 { "elite_0": true, "elite_1": true }

/* ---------- 工具函式 ---------- */
function threshold(format){ return Math.ceil((format+1)/2); }
function formatLabel(f){ return 'BO'+f+'（先取'+threshold(f)+'勝）'; }
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function seedOrder(n){
  let seeds = [1];
  while(seeds.length < n){
    const len = seeds.length*2;
    const next = [];
    for(const s of seeds){ next.push(s); next.push(len+1-s); }
    seeds = next;
  }
  return seeds;
}
function buildEvenList(realNames, size){
  const order = seedOrder(size);
  const list = new Array(size);
  for(let slot=0; slot<size; slot++){
    const seed = order[slot];
    list[slot] = (seed <= realNames.length) ? realNames[seed-1] : BYE;
  }
  return list;
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function matchCountsForSize(size){
  const arr=[]; let n=size/2;
  while(n>=1){ arr.push(n); n=n/2; }
  return arr;
}
function roundLabelsForSize(size){
  const counts = matchCountsForSize(size);
  const labels=[];
  for(let r=0;r<counts.length;r++){
    const players = counts[r]*2;
    if(players===2) labels.push('冠軍賽');
    else if(players===4) labels.push('準決賽・4強');
    else labels.push('第'+CN_NUM[r]+'輪・'+players+'強');
  }
  return labels;
}
function divName(id){ const d=DIVISIONS.find(x=>x.id===id); return d?d.name:id; }

/* 算出場次標籤名稱與時間，例如：32強-A 07/04 14:00 */
function getMatchTagLabel(size, r, i, matchObj){
  const counts = matchCountsForSize(size);
  const players = counts[r] * 2;
  const letter = String.fromCharCode(65 + i);
  let baseTag = (players === 2) ? '冠軍賽' : (players + '強-' + letter);
  if(matchObj && matchObj.timeStr){
    baseTag += ' ' + matchObj.timeStr;
  }
  return baseTag;
}

/* ---------- 樹狀圖座標計算 ---------- */
function colX(r){ return r * (CARD_W + COL_GAP); }
function computeCenters(counts){
  const centers = [];
  centers[0] = [];
  for(let i=0;i<counts[0];i++) centers[0][i] = TOP_PAD + i*UNIT + CARD_H/2;
  for(let r=1;r<counts.length;r++){
    centers[r] = [];
    for(let i=0;i<counts[r];i++){
      centers[r][i] = (centers[r-1][2*i] + centers[r-1][2*i+1]) / 2;
    }
  }
  return centers;
}
function connLine(x, y, w, h){
  return '<div class="bconn" style="left:'+x+'px;top:'+(y-h/2)+'px;width:'+w+'px;height:'+h+'px;"></div>';
}
function connLineV(x, y, h, w){
  return '<div class="bconn" style="left:'+(x-w/2)+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;"></div>';
}
function connectorsHtml(counts, centers){
  let html = '';
  const THICK = 2;
  for(let r=1;r<counts.length;r++){
    const childRightX = colX(r-1) + CARD_W;
    const midX = childRightX + COL_GAP/2;
    const parentX = colX(r);
    for(let i=0;i<counts[r];i++){
      const y0 = centers[r-1][2*i], y1 = centers[r-1][2*i+1], yp = centers[r][i];
      html += connLine(childRightX, y0, midX-childRightX, THICK);
      html += connLine(childRightX, y1, midX-childRightX, THICK);
      html += connLineV(midX, Math.min(y0,y1), Math.abs(y1-y0), THICK);
      html += connLine(midX, yp, parentX-midX, THICK);
    }
  }
  return html;
}

/* ---------- 建立單一組別賽事 ---------- */
function buildDivision(names, size, format, shuffle, evenSpread){
  const counts = matchCountsForSize(size);
  const totalRounds = counts.length;
  let real = names.slice(0, size);
  if(shuffle) real = shuffleArray(real);

  let list;
  if(evenSpread){
    list = buildEvenList(real, size);
  } else {
    list = real.slice();
    while(list.length < size) list.push(BYE);
  }

  const rounds = [];
  for(let r=0;r<totalRounds;r++){
    const count = counts[r];
    const arr = [];
    for(let i=0;i<count;i++){
      let p1=null, p2=null;
      if(r===0){ p1=list[i*2]; p2=list[i*2+1]; }
      arr.push({id:'r'+r+'_'+i, p1, p2, score1:0, score2:0, winner:null, format, done:false, timeStr:''});
    }
    rounds.push(arr);
  }
  const div = {size, totalRounds, rounds, champion:null, createdAt:Date.now()};
  resolveAllDiv(div);
  return div;
}

function resolveAllDiv(div){
  if(!div || !div.rounds) return;
  for(let r=0;r<div.totalRounds;r++){
    const round = div.rounds[r];
    for(const m of round){
      if(!m.done && m.p1 && m.p2){
        if(m.p1===BYE && m.p2===BYE){ m.winner=BYE; m.done=true; }
        else if(m.p1===BYE){ m.winner=m.p2; m.done=true; }
        else if(m.p2===BYE){ m.winner=m.p1; m.done=true; }
      }
    }
    if(r+1 < div.totalRounds){
      const next = div.rounds[r+1];
      for(let i=0;i<next.length;i++){
        const left = round[2*i], right = round[2*i+1];
        const m = next[i];
        if(left && left.done && m.p1==null) m.p1 = left.winner;
        if(right && right.done && m.p2==null) m.p2 = right.winner;
      }
    } else {
      div.champion = (round[0] && round[0].done && round[0].winner!==BYE) ? round[0].winner : null;
    }
  }
}

function findLocDiv(div, matchId){
  if(!div || !div.rounds) return null;
  for(let r=0;r<div.totalRounds;r++){
    const i = div.rounds[r].findIndex(m=>m.id===matchId);
    if(i>=0) return {r,i,m:div.rounds[r][i]};
  }
  return null;
}
function addPointDiv(div, matchId, side){
  const loc = findLocDiv(div, matchId);
  if(!loc) return;
  const m = loc.m;
  if(m.done || !m.p1 || !m.p2 || m.p1===BYE || m.p2===BYE) return;
  if(side===1) m.score1++; else m.score2++;
  const th = threshold(m.format);
  if(m.score1>=th){ m.winner=m.p1; m.done=true; }
  else if(m.score2>=th){ m.winner=m.p2; m.done=true; }
  resolveAllDiv(div);
}
function clearForwardDiv(div, r, i){
  if(!div || r+1>=div.totalRounds){ if(div) div.champion=null; return; }
  const nextIndex = Math.floor(i/2);
  const next = div.rounds[r+1][nextIndex];
  const isLeft = (i%2===0);
  if(isLeft) next.p1=null; else next.p2=null;
  if(next.done || next.winner || next.score1>0 || next.score2>0){
    next.score1=0; next.score2=0; next.winner=null; next.done=false;
    clearForwardDiv(div, r+1, nextIndex);
  }
}
function resetMatchDiv(div, matchId){
  const loc = findLocDiv(div, matchId);
  if(!loc) return;
  const m = loc.m;
  m.score1=0; m.score2=0; m.winner=null; m.done=false;
  clearForwardDiv(div, loc.r, loc.i);
}
function setRoundFormatDiv(div, roundIndex, format){
  if(!div || !div.rounds || !div.rounds[roundIndex]) return;
  format = Number(format);
  div.rounds[roundIndex].forEach(m=>{ if(!m.done) m.format = format; });
}
function setMatchTimeDiv(div, matchId, timeStr){

  if(!data || typeof data !== 'object') return emptyAllState();
  if(!data.divisions) data.divisions = { master: null, apex: null, elite: null };
  if(!data.siteTitle) data.siteTitle = '';

function playerRowPublic(name, score, isDone, isWinner){
  let cls = 'prow';
  if(isWinner) cls += ' winner';
  if(!name) cls += ' pending';
  else if(name===BYE) cls += ' bye';
  const label = name ? (name===BYE?'輪空':escapeHtml(name)) : '待定';
  const scoreTxt = (name && name!==BYE && isDone!==null) ? score : '';
  return '<div class="'+cls+'"><span class="name">'+label+'</span><span class="score">'+scoreTxt+'</span></div>';
}
function matchCardPublic(m, x, y, size, r, i){
  const showScore = m.p1 && m.p2 && m.p1!==BYE && m.p2!==BYE;
  const tagLabel = getMatchTagLabel(size, r, i, m);
  let html = '<div class="match" id="match_'+m.id+'" style="left:'+x+'px;top:'+y+'px;width:'+CARD_W+'px;height:'+CARD_H+'px;" data-names="'+escapeHtml((m.p1||'')+' '+(m.p2||'')).toLowerCase()+'">';
  html += '<div class="match-tag">'+escapeHtml(tagLabel)+'</div>';
  html += playerRowPublic(m.p1, showScore?m.score1:'', m.done, m.done && m.winner===m.p1);
  html += playerRowPublic(m.p2, showScore?m.score2:'', m.done, m.done && m.winner===m.p2);
  html += '</div>';
  return html;
}
function filterBracket(q){
  q = q.trim().toLowerCase();
  document.querySelectorAll('.match').forEach(el=>{
    const names = el.getAttribute('data-names')||'';
    if(q && names.includes(q)) el.classList.add('hl');
    else el.classList.remove('hl');
  });
}

function triggerGlobalSearch(){
  const input = document.getElementById('searchBox');
  if(!input) return;
  const q = input.value.trim().toLowerCase();
  currentQuery = input.value.trim();
  if(!q){ filterBracket(''); return; }

  if(!allState || !allState.divisions) return;

  let foundDivId = null;

  const currentDivObj = allState.divisions[currentDiv];
  if(currentDivObj && currentDivObj.rounds){
    for(const round of currentDivObj.rounds){
      for(const m of round){
        const names = ((m.p1||'') + ' ' + (m.p2||'')).toLowerCase();
        if(names.includes(q)){
          foundDivId = currentDiv;
          break;
        }
      }
      if(foundDivId) break;
    }
  }

  if(!foundDivId){
    for(const d of DIVISIONS){
      const divObj = allState.divisions[d.id];
      if(!divObj || !divObj.rounds) continue;
      for(const round of divObj.rounds){
        for(const m of round){
          const names = ((m.p1||'') + ' ' + (m.p2||'')).toLowerCase();
          if(names.includes(q)){
            foundDivId = d.id;
            break;
          }
        }
        if(foundDivId) break;
      }
      if(foundDivId) break;
    }
  }

  if(!foundDivId){
    alert('未在任何賽區找到名稱包含「' + currentQuery + '」的選手');
    filterBracket('');
    return;
  }

  if(currentDiv !== foundDivId){
    currentDiv = foundDivId;
    render();
  } else {
    filterBracket(currentQuery);
  }

  setTimeout(()=>{
    const matches = document.querySelectorAll('.match.hl');
    if(matches.length > 0){
      const firstMatch = matches[0];
      const bracketScroll = document.querySelector('.bracket-scroll');
      if(bracketScroll){
        const matchLeft = firstMatch.offsetLeft;
        const matchTop = firstMatch.offsetTop;
        bracketScroll.scrollLeft = Math.max(0, matchLeft - 40);
        bracketScroll.scrollTop = Math.max(0, matchTop - 60);
      }
    }
  }, 100);
}

function processImageFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 1600;
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        let quality = 0.85;
        let dataUrl = canvas.toDataURL('image/jpeg', quality);
        while(dataUrl.length > 4.5*1024*1024 && quality > 0.35){
          quality -= 0.1;
          dataUrl = canvas.toDataURL('image/jpeg', quality);
        }
        if(dataUrl.length > 4.8*1024*1024){ reject(new Error('圖片經壓縮後仍過大。')); return; }
        resolve(dataUrl);
      };
      img.onerror = ()=>reject(new Error('圖片讀取失敗。'));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(new Error('檔案讀取失敗。'));
    reader.readAsDataURL(file);
  });
}

async function onKeyVisualChange(inputEl){

  if(!file.type.startsWith('image/')){ alert('請選擇圖片檔案。'); inputEl.value=''; return; }

    if(!allState) allState = emptyAllState();

function divIsUntouched(div){
  if(!div || !div.rounds) return true;
  return div.rounds.every(round => round.every(m => m.score1===0 && m.score2===0));
}

function reseedDivision(div, names){
  if(!div || !div.rounds) return;
  let list = names.slice(0, div.size);
  while(list.length < div.size) list.push(BYE);
  const round0 = div.rounds[0];
  for(let i=0;i<round0.length;i++){
    round0[i].p1 = list[i*2] || BYE;
    round0[i].p2 = list[i*2+1] || BYE;
    round0[i].score1 = 0; round0[i].score2 = 0; round0[i].winner = null; round0[i].done = false;
  }
  for(let r=1;r<div.totalRounds;r++){
    div.rounds[r].forEach(m=>{ m.p1=null; m.p2=null; m.score1=0; m.score2=0; m.winner=null; m.done=false; });
  }
  div.champion = null;
  resolveAllDiv(div);
}

          '<select id="defaultFormat">'+[3,4,5].map(f=>'<option value="'+f+'"'+(f===3?' selected':'')+'>'+formatLabel(f)+'</option>').join('')+'</select>'+
        '</div>'+
        '<label class="checkbox-line"><input type="checkbox" id="shuffleCheck" checked> 隨機排籤</label>'+
        '<label class="checkbox-line"><input type="checkbox" id="evenSpreadCheck" checked> 輪空平均分散</label>'+
      '</div>'+
      '<div class="field"><label>選手暱稱（每行一位）</label>'+
        '<textarea id="namesInput" placeholder="請貼上選手暱稱，每行一位…"></textarea>'+
      '</div>'+
      '<div class="row-inline">'+
        '<button class="btn danger" onclick="createTournamentUI(\''+divId+'\')">清除並重新建立</button>'+
        '<button class="btn small" onclick="fillSampleNames()">填入測試名單</button>'+
      '</div>'+
    '</div></details>';
}

function matchRowAdmin(m, i, size, r){
  const ready = m.p1 && m.p2 && m.p1!==BYE && m.p2!==BYE && !m.done;
  const canReset = m.done || m.score1>0 || m.score2>0;
  const tagLabel = getMatchTagLabel(size, r, i, m);
  function side(name, isP1){
    let cls='m-side';
    if(!name) cls+=' empty';
    else if(name===BYE) cls+=' bye';
    else if(m.done && m.winner===name) cls+=' win';
    const label = name ? (name===BYE?'輪空':escapeHtml(name)) : '待定';
    const disabled = !ready;
    return '<div class="'+cls+'">'+
      '<span class="pname" title="'+label+'">'+label+'</span>'+
      (name && name!==BYE ? '<span class="scoreval">'+(isP1?m.score1:m.score2)+'</span>'+
        '<button class="scorebtn" '+(disabled?'disabled':'')+' onclick="onAddPoint(\''+m.id+'\','+(isP1?1:2)+')">+1</button>' : '')+
      '</div>';
  }
  let statusTxt = '待定', statusCls = '';
  if(m.done){ statusTxt='已完成'; statusCls=' done'; }
  else if(m.p1 && m.p2){ statusTxt='進行中'; }
  return '<div class="m-row">'+
    '<span class="idx" style="width:120px;flex:0 0 120px;font-size:11px;color:var(--teal);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+escapeHtml(tagLabel)+'</span>'+
    side(m.p1, true)+
    '<span class="vs">vs</span>'+
    side(m.p2, false)+
    '<span class="status-badge'+statusCls+'">'+statusTxt+'</span>'+
    '<span class="m-actions">'+
      '<button class="btn small" onclick="onSetMatchTime(\''+m.id+'\')">📅 時間</button>'+
      '<button class="btn small" '+(canReset?'':'disabled')+' onclick="onResetMatch(\''+m.id+'\')">重設</button>'+
    '</span>'+
  '</div>';
}

/* ---------- 後台事件處理 ---------- */
function adminLogin(){
  const pw = document.getElementById('pwBox').value;
  if(pw===ADMIN_PASSWORD){
    inMemoryAdminFlag = true;
    try{ sessionStorage.setItem('bracket3div_admin','1'); }catch(e){}
    render();
  } else {
    document.getElementById('pwErr').textContent = '密碼錯誤，請再試一次。';
  }
}
function adminLogout(){
  inMemoryAdminFlag = false;
  try{ sessionStorage.removeItem('bracket3div_admin'); }catch(e){}
  render();
}

function fillSampleNames(){
  const sizeSel = document.getElementById('sizeSelect');
  const n = sizeSel ? Number(sizeSel.value) : 128;
  const ta = document.getElementById('namesInput');
  const arr = [];
  for(let i=1;i<=n;i++) arr.push('Player'+String(i).padStart(3,'0'));
  ta.value = arr.join('\n');
}

async function createTournamentUI(divId){
  const size = Number(document.getElementById('sizeSelect').value);
  const ta = document.getElementById('namesInput');
  const raw = ta.value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(raw.length===0){ alert('請至少輸入一位選手暱稱。'); return; }
  if(allState.divisions[divId] && !confirm('確定要重新建立嗎？')) return;
  const format = Number(document.getElementById('defaultFormat').value);
  const shuffle = document.getElementById('shuffleCheck').checked;
  const evenSpread = document.getElementById('evenSpreadCheck').checked;
  allState.divisions[divId] = buildDivision(raw, size, format, shuffle, evenSpread);
  await saveState();
  render();
}

async function onAddPoint(matchId, side){
  const div = allState.divisions[currentDiv];
  addPointDiv(div, matchId, side);
  await saveState();
  render();
}
async function onResetMatch(matchId){
  if(!confirm('確定要重設比分嗎？')) return;
  const div = allState.divisions[currentDiv];
  resetMatchDiv(div, matchId);
  await saveState();
  render();
}
async function onSetFormat(roundIndex, value){
  const div = allState.divisions[currentDiv];
  setRoundFormatDiv(div, roundIndex, value);
  await saveState();
  render();
}
async function onSetMatchTime(matchId){
  const div = allState.divisions[currentDiv];
  const loc = findLocDiv(div, matchId);
  if(!loc) return;
  const oldTime = loc.m.timeStr || '';
  const newTime = prompt('請輸入比賽時間（例如：07/04 14:00，留空則移除時間）：', oldTime);
  if(newTime === null) return;
  setMatchTimeDiv(div, matchId, newTime);
  await saveState();
  render();
}

/* ============================================================
   啟動
   ============================================================ */
window.addEventListener('hashchange', async ()=>{
  if(getRoute()==='public'){
    const loaded = await loadState();
    allState = loaded;
  }
  render();
});

async function boot(){
  allState = await loadState();
  render();
  pollTimer = setInterval(async ()=>{
    if(getRoute()!=='public') return;
    
    // 1. 記錄搜尋框焦點與值
    const searchBox = document.getElementById('searchBox');
    const hadFocus = document.activeElement === searchBox;
    const val = searchBox ? searchBox.value : '';
    const cursor = searchBox ? searchBox.selectionStart : 0;

    // 2. 記錄目前頁面與賽程表內部的滾動位置
    const scrollTop = window.scrollY || document.documentElement.scrollTop;
    const scrollLeft = window.scrollX || document.documentElement.scrollLeft;
    const bracketScroll = document.querySelector('.bracket-scroll');
    const bScrollTop = bracketScroll ? bracketScroll.scrollTop : 0;
    const bScrollLeft = bracketScroll ? bracketScroll.scrollLeft : 0;

    // 3. 載入最新狀態並重新渲染
    const loaded = await loadState();
    allState = loaded;
    render();

    // 4. 自動還原捲軸位置
    window.scrollTo(scrollLeft, scrollTop);
    const newBracketScroll = document.querySelector('.bracket-scroll');
    if(newBracketScroll){
      newBracketScroll.scrollTop = bScrollTop;
      newBracketScroll.scrollLeft = bScrollLeft;
    }

    // 5. 還原搜尋狀態
    const newBox = document.getElementById('searchBox');
    if(newBox){
      if(hadFocus){ newBox.focus(); newBox.setSelectionRange(cursor,cursor); }
    }
  }, 5000);
}
boot();
</script>
